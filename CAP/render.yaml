services:
  # Backend Web Service on Render
  - type: web
    name: smartretail-backend-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smartretail-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false

databases:
  # Managed PostgreSQL Instance on Render
  - name: smartretail-postgres
    plan: free
    region: oregon
    databaseName: smartretail
    user: smartretail_user

